<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worktrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../app/config.js"></script><script src="../app/config.local.js"></script>
<style>
  /* Worktrail — 화면 한 벌 (2026-09-12 전체 손질). 구조·id·클래스·데이터는 그대로, 값은 전부 :root 변수에서 나온다.
     회색 10단계 · 글자 6단계 · 여백 5단계 · 선 3 · 둥글기 2 · 움직임 2박자. 종류 색(--k-*)은 종류 말·점·칩 테두리에만. */
  :root{
    /* 회색 사다리 — 어두운 데서 밝은 데로. 배경 3장(g0 바닥 · g1 카드 · g2 띠/머리) 위에 글자 4단계(g6 흐림 · g7 보조 · g8 본문 · g9 제목) */
    --g0:#0b0d11;--g1:#10141a;--g2:#151a21;--g3:#1b2129;--g4:#242c36;--g5:#343e4a;--g6:#5a6572;--g7:#8b96a3;--g8:#b9c2cc;--g9:#e8edf2;--g10:#f7f9fb;
    --c-bg:var(--g0);--c-card:var(--g1);--c-raise:var(--g2);--c-text:var(--g9);--c-text-1:var(--g8);--c-text-2:var(--g7);--c-text-3:var(--g6);
    --c-accent:#89b4fa;--c-accent-2:#b4d0ff;--c-amber:#fab387;--c-green:#a6e3a1;
    --ln:var(--g3);--ln-2:var(--g4);--ln-3:var(--g5);
    --sel:rgba(232,237,242,.05);--sel-2:rgba(232,237,242,.09);--acc-tint:rgba(137,180,250,.09);--amber-tint:rgba(250,179,135,.12);
    /* 글자 */
    --fs-h1:22px;--fs-title:20px;--fs-h2:15px;--fs-body:14px;--fs-small:13px;--fs-meta:12px;--fs-mono:11px;--fs-tiny:10.5px;
    --lh:1.55;--font:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
    /* 여백 · 둥글기 */
    --sp-0:4px;--sp-1:6px;--sp-2:12px;--sp-3:24px;--sp-4:36px;--r:10px;--r-s:6px;--r-pill:99px;
    --pad-x:20px;--gutter:28px;
    /* 그림자 — 카드는 살짝 뜨고, 떠 있는 것(선택 칩)은 확실히 */
    --sh-card:0 1px 0 rgba(255,255,255,.025) inset,0 1px 2px rgba(0,0,0,.35);--sh-pop:0 10px 30px rgba(0,0,0,.55),0 0 0 1px var(--ln-2);
    /* 움직임 — 짧은 것(.14) 과 보통(.22). 곡선은 둘 다 같다. */
    --t-fast:.14s;--t:.22s;--ease:cubic-bezier(.2,.7,.2,1);
    /* 종류 색 — 결정 호박 · 제약 주황 · 배제 붉음 · 바꿈 파랑 · 확인 초록 · 발견 보라 · 생각 회색 · 커밋 민트 */
    /* 2026-09-13 사용자 "민트·호박 너무 구림" → 파스텔 한 벌(복숭아·장미·연갈·하늘·풀·연보라·회·노랑). 결정은 복숭아, 커밋은 연노랑. */
    --k-decision:#fab387;--k-constraint:#f38ba8;--k-ruled_out:#eba0ac;--k-change:#89b4fa;--k-verified:#a6e3a1;--k-finding:#cba6f7;--k-thought:#9399b2;
    --k-commit:#f9e2af;--k-asked:#fab387;--k-closed:#5b636d;--k-opened:#c8d0d8;
  }
  html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  *{box-sizing:border-box;}
  a{color:var(--c-accent);text-decoration:none;transition:color var(--t-fast);} a:hover{color:var(--c-accent-2);text-decoration:underline;text-underline-offset:2px;}
  ::selection{background:rgba(137,180,250,.28);}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:var(--g4);border-radius:5px;border:2px solid var(--g0);} ::-webkit-scrollbar-thumb:hover{background:var(--g5);}
  button,select,input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:4px;}
  [hidden]{display:none !important;}
  .mono{font-family:var(--mono);}
  code{font-family:var(--mono);font-size:.9em;color:var(--c-text);background:var(--sel-2);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere;}
  .hd b,.full b,.why b,.t b,.m b{font-weight:600;color:var(--c-text);}
  .rrow .hd b{font-weight:500;}
  pre{font-family:var(--mono);font-size:var(--fs-meta);line-height:1.6;color:var(--c-text-1);background:var(--g0);border:1px solid var(--ln);border-radius:var(--r-s);padding:12px 14px;margin:10px 0 4px;overflow:auto;}

  /* ── 위 띠 ─────────────────────────────────────────────── */
  .top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 var(--pad-x);
    border-bottom:1px solid var(--ln);background:rgba(16,20,26,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;}
  .logo .box{width:24px;height:24px;border:1.5px solid var(--c-green);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--c-green);letter-spacing:0;
    box-shadow:0 0 0 3px rgba(166,227,161,.08);transition:box-shadow var(--t),transform var(--t) var(--ease);} .logo:hover .box{box-shadow:0 0 0 4px rgba(166,227,161,.16);transform:rotate(-4deg);}
  .logo .name{font-size:12px;letter-spacing:.16em;font-weight:600;color:var(--g10);} .logo .name span{color:var(--c-text-3);font-weight:400;}
  .crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto;color:var(--c-text-2);font-size:var(--fs-meta);} .crumb .sep{color:var(--ln-3);}
  .crumb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spacer{flex:1;}
  .btn{background:none;border:1px solid var(--ln-2);border-radius:var(--r-s);color:var(--c-text-2);padding:6px 12px;font-size:var(--fs-meta);cursor:pointer;white-space:nowrap;flex:none;line-height:1.3;
    transition:border-color var(--t-fast),color var(--t-fast),background-color var(--t-fast);}
  .btn:hover{border-color:var(--ln-3);color:var(--c-text);background:var(--sel);text-decoration:none;}
  .top .btn.on{color:var(--c-text);background:var(--sel-2);border-color:var(--ln-3);}
  #who{color:var(--c-text-3);}
  .muted{color:var(--c-text-2);} .dim{color:var(--c-text-3);}

  /* ── 칩 ───────────────────────────────────────────────── */
  .chip{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.06em;display:inline-flex;align-items:center;height:20px;line-height:1;padding:0 8px;margin:0;border-radius:var(--r-pill);border:1px solid var(--ln-2);color:var(--c-text-2);white-space:nowrap;flex:none;}
  .chip.open{border-color:var(--c-accent);color:var(--c-accent);} .chip.closed{border-color:var(--ln-2);color:var(--c-text-3);}
  .chip.user{border-color:rgba(250,179,135,.5);color:var(--c-amber);} .chip.agent{border-color:var(--ln-2);color:var(--c-text-2);}
  .chip.repo{border-color:rgba(137,180,250,.35);color:var(--c-accent);background:var(--acc-tint);}
  .chip.thread{border-color:var(--ln-2);color:var(--c-text-2);}
  .chip.topic{border-color:rgba(250,179,135,.4);color:#c9a35a;}

  /* ── 뿌리 · 제목 · 카드 ─────────────────────────────────── */
  .wrap{max-width:960px;margin:0 auto;padding:var(--sp-4) var(--pad-x) 80px;}
  h1{margin:0;font-size:var(--fs-h1);font-weight:600;line-height:1.3;letter-spacing:-.012em;color:var(--g10);text-wrap:pretty;} h2{margin:0;font-size:var(--fs-h2);font-weight:600;}
  .label{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.1em;color:var(--c-text-2);text-transform:uppercase;}
  .card{background:var(--c-card);border:1px solid var(--ln);border-radius:var(--r);padding:18px var(--pad-x);box-shadow:var(--sh-card);}
  .empty{font-size:var(--fs-small);color:var(--c-text-3);font-style:italic;}
  .notice{font-size:var(--fs-meta);color:var(--c-text-2);margin-top:var(--sp-2);max-width:720px;line-height:1.55;}
  .conflict{margin-top:10px;font-size:var(--fs-meta);color:var(--c-amber);}
  .login{max-width:360px;margin:120px auto;background:var(--c-card);border:1px solid var(--ln-2);border-radius:var(--r);padding:28px;text-align:center;box-shadow:var(--sh-card);}

  /* ── 스레드 화면 ─────────────────────────────────────────── */
  .wrap.thread{max-width:932px;}
  .thead .t{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;} .thead .t h1{min-width:0;overflow-wrap:anywhere;flex:1 1 320px;} .thead .flip{margin-left:auto;}
  .thead .num{font-family:var(--mono);font-size:var(--fs-meta);color:var(--c-text-3);letter-spacing:.02em;}
  .thead .ph{margin-top:var(--sp-1);} .thead .closedline{margin-top:var(--sp-1);font-size:var(--fs-body);color:var(--c-text);display:flex;align-items:center;gap:var(--sp-1);} .thead .closedline .w{color:var(--c-text-2);}
  .tlayout{display:grid;grid-template-columns:minmax(0,640px) 220px;gap:var(--sp-3);margin-top:var(--sp-3);align-items:start;}
  .tbody{min-width:0;display:flex;flex-direction:column;gap:var(--sp-2);}
  .tbody .sec{margin-top:0;}
  .tmeta{display:flex;flex-direction:column;}
  .tmeta .mi{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-2) 0;border-top:1px solid var(--ln);} .tmeta .mi:first-child{border-top:none;padding-top:0;}
  .tmeta .mi .v{font-size:var(--fs-body);color:var(--c-text);min-width:0;overflow-wrap:anywhere;} .tmeta .mi .v.me{color:var(--c-amber);} .tmeta .mi .v.dim{color:var(--c-text-2);}
  .tmeta .mi .v2{font-size:var(--fs-meta);color:var(--c-text-2);font-family:var(--mono);}
  .tmeta .btn{margin-top:var(--sp-2);align-self:flex-start;}
  .rr{border-top:1px solid var(--ln);} .rr:first-of-type{border-top:none;}
  .rr summary{list-style:none;cursor:pointer;border-radius:var(--r-s);transition:background-color var(--t-fast);} .rr summary:hover{background:var(--sel);} .rr summary::-webkit-details-marker{display:none;} .rr.flat summary{cursor:default;} .rr.flat summary:hover{background:none;}
  .rr .full{margin-left:64px;}
  .rrow{display:grid;grid-template-columns:52px minmax(0,1fr) 84px;gap:var(--sp-2);align-items:baseline;padding:8px 4px;}
  .rrow .kw{font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-2);white-space:nowrap;} .rrow .kw.hash{font-size:var(--fs-meta);color:var(--k-commit);opacity:.85;}
  .rrow .hd{color:var(--c-text-1);} .rrow.prim .hd{color:var(--c-text);font-weight:500;}
  .by{font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-3);margin-left:8px;font-weight:400;}
  span.sup{font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-amber);margin-left:8px;font-weight:400;opacity:.85;white-space:nowrap;}
  .supd{display:block;margin-top:8px;font-size:12.5px;color:var(--c-amber);text-decoration:none;border-left:2px solid rgba(250,179,135,.35);padding-left:10px;overflow-wrap:anywhere;}
  .supd:hover{text-decoration:underline;}
  .rr.replaced .rrow.prim .hd, .rr.replaced .rrow .hd,
  .ev.replaced.prim .hd, .ev.replaced .hd, .it.replaced .hd{color:var(--c-text-3);font-weight:400;}
  .rrow .at{font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-3);text-align:right;white-space:nowrap;} .rrow .at .u{color:var(--c-text);}
  .sec{margin-top:var(--sp-3);background:var(--c-card);border:1px solid var(--ln);border-radius:var(--r);padding:14px 18px 12px;box-shadow:var(--sh-card);}
  .sec .label{margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .sec .label .n{color:var(--c-text-3);letter-spacing:0;}
  .sec .label .scopehint{color:var(--c-text-3);letter-spacing:0;text-transform:none;margin-left:auto;font-size:var(--fs-tiny);}
  /* 카드 세 줄 — SO FAR · NEXT · WHY. 라벨은 왼쪽 좁은 열, 줄 사이는 얇은 선 */
  .st{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px 14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--ln);}
  .st:first-of-type{border-top:none;padding-top:2px;} .st:last-of-type{padding-bottom:2px;}
  .st .k{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.1em;color:var(--c-text-3);text-transform:uppercase;padding-top:3px;}
  .it{border-top:1px solid var(--ln);padding:7px 0;}
  .it:first-of-type,.st .it{border-top:none;padding:0;}
  .it summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;min-width:0;border-radius:var(--r-s);margin:0 -6px;padding:2px 6px;transition:background-color var(--t-fast);}
  .it:not(.flat) summary:hover{background:var(--sel);}
  .it summary::-webkit-details-marker{display:none;}
  .it summary::before{content:"›";color:var(--c-text-3);font-size:15px;line-height:1;flex:none;width:9px;transform:translateY(1px);transition:transform var(--t-fast) var(--ease),color var(--t-fast);}
  .it summary:hover::before{color:var(--c-text-2);}
  .it[open] summary::before{transform:rotate(90deg) translateX(1px);}
  .it.flat summary{cursor:default;} .it.flat summary::before{content:"·";}
  .hd{font-size:var(--fs-body);min-width:0;flex:1;overflow-wrap:anywhere;text-wrap:pretty;}
  .hd.big{font-weight:600;color:var(--c-text);font-size:15px;}
  .meta{font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-3);white-space:nowrap;flex:none;}
  .meta .u{color:var(--c-text);} .meta .rp{color:var(--c-text);} .meta .fail{color:var(--c-text);font-weight:500;} .meta .re{color:var(--c-text);}
  .meta .nk{color:var(--c-text);}
  .full:not(.now){margin:8px 0 6px 19px;font-size:var(--fs-small);color:var(--c-text-1);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;}
  .full .why{margin-top:8px;color:var(--c-text-2);font-size:12.5px;border-left:2px solid var(--ln-2);padding-left:10px;}
  .full .ids{margin-top:8px;font-family:var(--mono);font-size:var(--fs-tiny);color:var(--c-text-3);}
  .stale{color:var(--c-amber);}
  .metaline{margin-top:12px;font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;} .metaline .ml{color:var(--c-text-3);letter-spacing:.08em;text-transform:uppercase;font-size:10px;} .metaline .sep{color:var(--ln-3);} .metaline a{color:var(--c-text-2);} .metaline a:hover{color:var(--c-text);}
  .metaline select.move{display:inline-block;margin:0 0 0 auto;max-width:none;padding:0;border:none;background:none;color:var(--c-text-2);font-family:var(--mono);font-size:var(--fs-mono);cursor:pointer;-webkit-appearance:none;appearance:none;} .metaline select.move:hover{color:var(--c-text);}
  .terms{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:var(--fs-mono);color:var(--c-text-2);} .terms .ml{color:var(--c-text-3);letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:2px;}
  .terms .term{border:1px solid var(--ln-2);border-radius:var(--r-pill);padding:1px 8px;color:var(--c-text-2);cursor:pointer;transition:border-color var(--t-fast),color var(--t-fast);} .terms .term.repo{border-style:dashed;} .terms .term:hover{border-color:var(--c-accent);color:var(--c-text);}
  abbr.term{text-decoration:underline dotted var(--c-text-3);text-underline-offset:3px;cursor:pointer;transition:color var(--t-fast);} abbr.term:hover{text-decoration-color:var(--c-accent);color:var(--c-text);}
  abbr.term.guess{text-decoration-color:var(--ln-3);}
  @keyframes cbFlash{0%{box-shadow:inset 0 0 0 999px rgba(137,180,250,.18);}100%{box-shadow:none;}} .flash{animation:cbFlash 2.4s ease-out;border-radius:var(--r-s);}
  .tbody code{cursor:pointer;} .tbody code:hover{color:var(--c-accent-2);}
  .find .hit .def{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#7dcbe6;border:1px solid rgba(137,180,250,.5);border-radius:var(--r-pill);padding:1px 7px;text-transform:uppercase;}
  .selchip{position:fixed;z-index:30;background:var(--c-raise);border:1px solid var(--ln-2);border-radius:var(--r-pill);padding:6px 12px;font-size:var(--fs-meta);color:var(--c-text);cursor:pointer;box-shadow:var(--sh-pop);white-space:nowrap;animation:wtRise var(--t) var(--ease);} .selchip:hover{border-color:var(--c-accent);}
  .find .hit .first{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--c-green);border:1px solid rgba(166,227,161,.5);border-radius:var(--r-pill);padding:1px 7px;text-transform:uppercase;}
  .repoblock{margin-top:10px;border-top:1px dashed var(--ln-2);padding-top:6px;}
  .repoblock summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:var(--fs-tiny);letter-spacing:.08em;color:var(--c-text-3);text-transform:uppercase;padding:5px 0;transition:color var(--t-fast);}
  .repoblock summary::-webkit-details-marker{display:none;} .repoblock summary::before{content:"› ";color:var(--ln-3);}
  .repoblock[open] summary::before{content:"⌄ ";} .repoblock summary:hover{color:var(--c-text-2);}
  .repoblock summary .n{color:var(--ln-3);letter-spacing:0;text-transform:none;margin-left:6px;}
  .st .many{display:flex;flex-direction:column;min-width:0;} .st .many .it{padding:4px 0;} .st .many .it + .it{border-top:1px solid var(--ln);}
  .st .anc{font-family:var(--mono);font-size:var(--fs-meta);color:var(--c-text-2);line-height:1.6;overflow-wrap:anywhere;padding-top:2px;min-width:0;}
  .sec .anc{font-family:var(--mono);font-size:var(--fs-meta);color:var(--c-text-2);line-height:1.7;overflow-wrap:anywhere;}
  .log .label .r{margin-left:auto;display:flex;gap:6px;letter-spacing:0;text-transform:none;} .log .kchip{cursor:pointer;margin:0;} .log .kchip:hover{color:var(--c-text);border-color:var(--ln-3);}
  .kchip.on{border-color:var(--c-accent);color:var(--c-accent);background:var(--acc-tint);}
  /* 결정 로그 — 번호 · 날짜 · 제목 · 유효 · 누가 · › */
  .lrow{display:grid;grid-template-columns:56px 40px minmax(0,1fr) 44px 44px 12px;gap:0 12px;align-items:baseline;padding:8px 6px;margin:0 -6px;border-top:1px solid var(--ln);cursor:pointer;border-radius:var(--r-s);transition:background-color var(--t-fast);} .lrow:first-of-type{border-top:none;}
  /* 확장 79호 — 영어는 같은 뜻에 글자를 더 쓴다. 실측(11px mono): 유효 24.2 · 대체됨 36.3 대
     in force 46.8 · superseded 74.1. 44px 고정 칸을 superseded 가 30px 침범했다. 행마다 독립
     그리드라 auto 로 바꾸면 세로 정렬이 깨지므로, 언어를 아는 지금 그 칸만 넓힌다 —
     한국어 화면은 한 픽셀도 바뀌지 않는다. */
  html[lang="en"] .lrow{grid-template-columns:56px 40px minmax(0,1fr) 78px 44px 12px;}
  .lrow:hover{background:var(--sel);}

  const fmtAbs = (ms) => { if (!ms) return "—"; const d = new Date(ms); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes()); };
  // 날짜 머리 — 영어는 월 이름이 짧고 요일이 길다. 형식이 달라 사전으로 안 된다.
  const WD_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const dayLabel = (d) => LANG === "en"

  const fmtRel = (ms) => { if (!ms) return "—"; const diff = Date.now() - ms, m = Math.floor(diff / 60000), h = Math.floor(diff / 3600000), d = Math.floor(diff / 86400000);

    const x = new Date(ms); return (x.getMonth() + 1) + "월 " + x.getDate() + "일"; };
  // 확장 31호 — 단계·차례는 서버가 도출한 값(core/phase.py)에 말만 붙인다

  // 확장 60호 — 노트의 갈래(D14720): 에이전트가 붙인 것만 그 말로, 옛 노트는 "노트" 그대로

  // 확장 40호 — 기록을 남긴 클라이언트(MCP clientInfo.name). 실측: claude-code · codex-mcp-client.
  const CLIENT_KO = { "claude-code": "Claude Code", "codex-mcp-client": "Codex" };

                         : t.owner ? (OWNER_KO[t.owner] || t.owner) + " 에게" : "미정";

  const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
  const hm = (ms) => { const d = new Date(ms); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
  const shortRepo = (id) => id.replace(/^local:/, "").replace(/\/\.git$/, "").replace(/^path:/, "").replace(/^\/Users\/[^/]+\//, "~/");

  async function api(path) {
    if (SNAP) {
      const r = await fetch(snapFile(path));
      if (!r.ok) throw new Error(r.status === 404 ? "이 데모에는 없는 기록이다" : "HTTP " + r.status);
      return r.json();
    }
    const res = await fetch(CFG.APP_BASE + path, { headers: { "Authorization": "Bearer " + token() } });
    if (res.status === 401) { localStorage.removeItem("cb_token"); render(); throw new Error("unauthorized"); }
    if (!res.ok) { let m = "HTTP " + res.status; try { m = (await res.json()).message || m; } catch (e) {} throw new Error(m); }
    return res.json();
  }

  // 확장 47호 — 화면이 쓰는 유일한 쓰기: 주제 합치기·옮기기. 로컬 창은 POST 도 같은 길로 중계한다(ui_server.do_POST).
  async function post(path, body) {
    if (SNAP) throw new Error("읽기 전용 데모라 바꿀 수 없다");
    const res = await fetch(CFG.APP_BASE + path, { method: "POST", headers: { "Authorization": "Bearer " + token(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 401) { localStorage.removeItem("cb_token"); render(); throw new Error("unauthorized"); }
    if (!res.ok) { let m = "HTTP " + res.status; try { m = (await res.json()).message || m; } catch (e) {} throw new Error(m); }
    return res.json();
  }

  function route() {
    const h = location.hash || "";
    // 데모도 현황으로 연다 (사용자 2026-09-14). 전에는 회고로 열었는데, 제품이 무엇인지 먼저
    // 보여 주는 것은 지금 무슨 일이 어디까지 왔는지이지 지나간 회고가 아니다. 가상 데모는 열린
    // 스레드가 있어 첫 화면이 비지 않는다 — 회고로 돌렸던 이유가 이 데이터에는 없다.
    const qs = Object.fromEntries(new URLSearchParams((h.split("?")[1] || "")).entries());   // 확장 55호 — 어느 기록으로 갈지
    let m = h.match(/^#\/threads\/(\d+)\/evidence(?:\?.*)?$/); if (m) return { evidence: parseInt(m[1], 10), ev: qs.ev ? parseInt(qs.ev, 10) : null };
    m = h.match(/^#\/threads\/(\d+)(?:\?.*)?$/); if (m) return { thread: parseInt(m[1], 10), item: qs.item || null };
    m = h.match(/^#\/review(?:\/([\w-]*))?(?:\?.*)?$/); if (m) return { review: m[1] || null, rthread: qs.thread ? parseInt(qs.thread, 10) : null, item: qs.item || null };
    m = h.match(/^#\/find(?:\/(.*))?$/); if (m) return { find: m[1] ? decodeURIComponent(m[1]) : "" };
    if (h === "#/join" && !SNAP) return { join: true };            // 확장 108호 — 운영자만 연다(서버가 막는다)
    m = h.match(/^#\/prior(?:\/(\d+))?(?:\/s(\d+))?$/); if (m && !SNAP) return { prior: m[1] ? parseInt(m[1], 10) : null, priorSession: m[2] ? parseInt(m[2], 10) : null };
    return { list: true };
  }

  // 현황 — 확장 31호. 저장소 대신 주제로 묶고, 행은 "단계 · 무엇 · 남은 것 한 줄 · 누구 차례 · 언제". 마무리된 주제는 아래 접힌 한 줄.
  let statusFilter = "all", statusTab = "open";   // 화면이 살아 있는 동안만

    // 현황은 "지금 내가 뭘 해야 하나"에 답하는 화면이므로 조사는 기본에서 뺀다 — 왼쪽 "자동 조사"로 따로 본다.

    // 완료된 주제가 둘이 되는 순간 나머지는 현황에서 갈 길이 없었다.

    view.querySelectorAll(".li[data-id]").forEach((el) => el.addEventListener("click", () => { location.hash = "#/threads/" + el.dataset.id; }));

  // 확장 64호 — "지금" 스트림(#512). status.stream(모든 종류의 최근 사건 40개; 옛 서버는 latest 로 대신)을 오른쪽 띠에.
  // 화면이 현황에 머무는 동안 5초마다 status 를 다시 받아 못 본 사건만 위로 밀어 넣는다 — 목록·필터는 건드리지 않는다.

  const STREAM_MS = 5000;
  let streamTimer = null, streamSeen = null, streamFresh = new Set();   // streamFresh: 다시 그릴 때 "새 줄" 표시를 이어 준다
  const evKey = (e) => `${e.kind}:${e.case_id}:${e.at}`;
  const evCls = (e) => e.kind === "note" ? "n-" + (e.note_kind || "thought") : e.kind;
  const evText = (e) => e.kind === "closed" && e.text === "resolved" ? tr("닫았다") : e.kind === "opened" && e.text === e.title ? tr("열었다") : headline(e.text).head;
  const evRow = (e, fresh) => `<div class="ev2 kc kc-${evCls(e)} ${fresh ? "new" : ""}" data-id="${e.case_id}"><span class="d"></span><div style="min-width:0;">
      <div class="tx"><span class="k">${kindLabel(e)}</span>${md(evText(e))}</div>
      <div class="m"><span class="id">#${e.case_id}</span> ${esc(e.title)} · <span title="${fmtAbs(e.at)}">${fmtRel(e.at)}</span>${e.authority === "user" ? " · user" : ""}</div></div></div>`;
  const streamList = (data) => (data.stream || data.latest || []).slice(0, 40);
  // 확장 68호 — 타임라인. 위(up) = 방향이 바뀐 것, 아래(dn) = 일한 흔적. 같은 자리(가로 1.4%)에 몰리면 한 칸씩 위/아래로 쌓는다.
  const TL_UP = new Set(["decision", "constraint", "ruled_out", "closed", "opened", "focus", "open", "next", "asked", "term"]);
  const tlTarget = (e) => e.kind === "decision" && e.id ? `#/threads/${e.case_id}?item=D${e.id}` : e.kind === "constraint" && e.id ? `#/threads/${e.case_id}?item=C${e.id}` : `#/threads/${e.case_id}`;
  function tlHtml(list, curId, now) {
    now = now || Date.now();
    if (!list.length) return `<div class="tl" id="nowTl"><div class="axis"></div><div class="empty">아직 없다</div></div>`;
    // 축은 시간이 아니라 개수다(사용자 2026-09-12: "같은 시간대에 기록이 많은 건 넓게, 작업한 개수 기준으로"). 사건마다 같은 폭 —
    // 바쁜 시간대가 저절로 넓어진다. 시각은 눈금 글자가 말한다(묶음이 바뀌는 첫 사건 자리에).
    const sorted = [...list].sort((a, b) => a.at - b.at), n = sorted.length;
    const pos = (i) => n === 1 ? 96 : 3 + i / (n - 1) * 93;   // 3%(가장 오래된 것) ~ 96%(가장 최근 것), 100% 은 "지금"
    const lanes = { up: [], dn: [] }, out = [];
    sorted.forEach((e, i) => {
      const side = TL_UP.has(e.kind) ? "up" : "dn", px = pos(i);
      let lvl = 0; for (const l of lanes[side]) if (Math.abs(l.px - px) < 1.2 && l.lvl === lvl) { lvl++; }
      lvl = Math.min(lvl, 3);   // 몰리면 옆으로 살짝 비켜 선다
      lanes[side].push({ px, lvl });
      const w = ["decision", "constraint", "ruled_out", "closed", "opened"].includes(e.kind) ? "w3" : e.kind === "commit" ? "w2" : "";   // 무게 = 길이
      out.push(`<span class="tk ${side} ${w} kc kc-${evCls(e)} ${curId && e.case_id === curId ? "here" : ""} ${streamFresh.has(evKey(e)) ? "new" : i === n - 1 ? "last" : ""}" style="left:calc(24px + (100% - 46px) * ${(px / 100).toFixed(4)} + ${lvl * 3}px);${side === "up" ? "bottom" : "top"}:calc(50% + 4px)" data-to="${tlTarget(e)}" data-k="${esc(kindLabel(e))}" data-t="${esc(evText(e))}" data-m="#${e.case_id} ${esc(e.title)} · ${fmtRel(e.at)}"></span>`);
    });
    // 눈금 글자: 시각 묶음(10분 안·시간·일)이 바뀌는 첫 사건 자리에, 앞 글자와 9% 이상 떨어질 때만. 오른쪽 끝은 "지금".
    const bucket = (at) => { const m = Math.round((now - at) / 60000); return LANG === "en" ? (m < 10 ? "just now" : m < 60 ? `${Math.round(m / 10) * 10}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`) : (m < 10 ? "방금" : m < 60 ? `${Math.round(m / 10) * 10}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`); };
    let lastB = null, lastP = -100; const marks = [];
    sorted.forEach((e, i) => { const b = bucket(e.at), p = pos(i); if (b !== lastB && p - lastP >= 9 && p < 88) { marks.push(`<span class="lab" style="left:calc(24px + (100% - 46px) * ${(p / 100).toFixed(4)});transform:translateX(-50%)">${b}</span>`); lastP = p; } lastB = b; });
    return `<div class="tl" id="nowTl"><span class="side u">${tr("방향")}</span><span class="side d">${tr("흔적")}</span><div class="axis"></div>${out.join("")}${marks.join("")}<span class="lab r">${tr("지금")}</span><div class="bub" id="tlBub"></div></div>`;

  function bindTl(tl) {
    if (!tl) return;

        if (top < 8) top = r.bottom + 8; if (top + bh > window.innerHeight - 8) top = r.top - bh - 8;
        bub.style.top = top + "px"; bub.style.bottom = "auto";
      });
      k.addEventListener("mouseleave", () => { bub.style.display = "none"; });
    });
  }
  function streamHtml(data, compact) {
    const list = streamList(data), rt = route(), cur = rt.thread || rt.evidence || rt.rthread || null;
    return `<div class="now ${compact ? "strip" : "full"}" id="nowBox"><div class="nowh"><span class="live" title="5초마다 새로 받는다"></span><b>NOW</b><span class="more">${tr(compact ? "위 = 방향 · 아래 = 흔적 · 올리면 읽고 누르면 간다" : "최근 40건 · 위 = 방향 · 아래 = 흔적")}</span><span class="at" id="nowAt">${SNAP ? tr("스냅샷") : hm(data.generated_at || Date.now())}</span></div>
      ${tlHtml(list, cur, data.generated_at)}

  }

      if (tl && !freshKeys.size) { const keep = streamFresh; streamFresh = new Set(); tl.outerHTML = tlHtml(list, rt.thread || rt.evidence || rt.rthread || null, d.generated_at); bindTl($("nowTl")); streamFresh = keep; return; }

      if (list.some((e) => freshKeys.has(evKey(e)) && (e.kind === "opened" || e.kind === "closed"))) { lastStatus = d; streamFresh = freshKeys; listDirty = true; return render(); }

  }
  // 상세를 조용히 다시 그린다 — 열려 있던 서랍과 스크롤은 그대로, 카드 세 줄은 잠깐 빛난다

  // 확장 42호 — 설치 전 기록은 목록에 섞지 않는다(D13627). 있다는 사실만 한 줄, 회고에는 넣지 않는다.

  // 헤드라인 = 첫 문장(15자 이상에서 처음 만나는 문장 끝), 110자를 넘으면 100자에서 자른다. 나머지는 펼쳐야 보인다.
  function headline(text) {
    const raw = String(text == null ? "" : text).trim();

    let h = m ? m[1] : s;

  const ageDays = (ms) => Math.floor((Date.now() - ms) / 86400000);

  // 확장 123호 (D15872) — 근거 번호는 글이 아니라 링크다: 누르면 그 증거로 간다(55호의 길). 노트·결정·배제가 같은 그림.
  const evLinks = (cid, ids) => (ids || []).map((n) => cid != null ? `<a class="evl" href="#/threads/${cid}/evidence?ev=${n}">#${n}</a>` : `#${n}`).join(", ");
  const evTail = (cid, ids, sep) => ids && ids.length ? (sep ? " · " : "") + "cites " + evLinks(cid, ids) : "";
  function entry(text, opts) {
    const o = opts || {};
    const { head, more } = headline(text);
    const bits = [];

    // 확장 71호 — 읽기 모드(#516): o.body 면 제목 아래 본문 두 줄을 접힌 채로도 보인다(펼치면 전부), o.obs 면 관찰 한 줄을 흐리게.

  const logRow = (x, here, extra) => {

          ${nRo ? `<div class="drawer sec" data-d="ro" hidden><div class="label">${tr("배제")} <span class="n">${nRo}</span></div>${(s.ruled_out || []).map((x) => entry(x.hypothesis, { key: `R${x.ruled_out_id}`, at: x.recorded_at, scope: x.scope === "repo" ? "repo" : null, ids: `R${x.ruled_out_id}`, ev: { case: s.case_id, ids: x.evidence_ids } })).join("")}</div>` : ""}
          <div class="drawer sec" data-d="commits" hidden><div class="label">${tr("커밋")} <span class="n">${nCommit} · ${tr("이 스레드에 붙은 것")}</span></div>${commits}</div>
          <div class="drawer sec" data-d="notes" hidden><div class="label">${tr("노트")} <span class="n">${notes.length}${noteKindCounts ? ` · ${noteKindCounts}` : ""}${kindCount["노트"] && noteKindCounts ? ` · ${tr("갈래 없음")} ${kindCount["노트"]}` : ""}</span><span class="scopehint">${evidenceN(s.evidence_count)} · <a href="#/threads/${s.case_id}/evidence">${tr("원문 전부 보기")} →</a></span></div>${notesHtml}</div>
          ${s.open ? `<div class="drawer sec" data-d="open" hidden><div class="label">${tr("미결")} <span class="n">${tr("아직 풀리지 않은 것 — 선언")}</span></div>${openHtml}</div>` : ""}
          <div class="drawer sec" data-d="anchor" hidden><div class="label">anchor <span class="n">${tr("이 스레드가 붙은 자리")}</span></div><div class="anc">${esc(shortRepo(repoName)) || "—"} · ${folderHtml}</div></div>
        </div>
      </div>`;
    view.querySelectorAll(".terms .term").forEach((el) => el.addEventListener("click", () => { findFirst = true; location.hash = "#/find/" + encodeURIComponent(el.dataset.term); }));
    // 확장 57호 — 로그 줄: 누르면 펼침, 칩으로 거름(누가 / 대체됨 숨김). 밑줄·코드·링크 클릭은 제 일을 한다.
    view.querySelectorAll(".lrow").forEach((r) => r.addEventListener("click", (ev) => { if (ev.target.closest("abbr,code,a,.why")) return; r.classList.toggle("open"); }));
    // 확장 59호 — 칩 하나 = 서랍 하나. 열린 칩을 다시 누르면 닫힌다. 로그의 "더 보기"/"접기"는 .all 토글.
    const drawers = view.querySelectorAll(".drawer"), chipEls = view.querySelectorAll(".chips .chip");
    const openDrawer = (k) => { drawers.forEach((d) => { d.hidden = d.dataset.d !== k; }); chipEls.forEach((c) => c.classList.toggle("on", c.dataset.d === k)); };
    chipEls.forEach((c) => c.addEventListener("click", () => openDrawer(c.classList.contains("on") ? null : c.dataset.d)));
    openDrawer(firstDrawer);
    const logEl = view.querySelector(".log");
    view.querySelectorAll(".drawer .more").forEach((m) => m.addEventListener("click", () => (m.closest(".nsec") || m.closest(".drawer")).classList.toggle("all")));   // 60호 — 노트 서랍도 같은 더 보기
    const logF = { who: "all", nosup: false };
    const applyLog = () => view.querySelectorAll(".lrow").forEach((r) => r.classList.toggle("hide", (logF.who !== "all" && r.dataset.who !== logF.who) || (logF.nosup && r.dataset.sup === "1")));
    view.querySelectorAll(".log .kchip").forEach((c) => c.addEventListener("click", () => {
      const f = c.dataset.f;
      if (f === "nosup") { logF.nosup = !logF.nosup; c.classList.toggle("on", logF.nosup); }
      else { logF.who = f; view.querySelectorAll(".log .kchip:not([data-f=nosup])").forEach((x) => x.classList.toggle("on", x.dataset.f === f)); }
      if (logEl && (logF.who !== "all" || logF.nosup)) logEl.classList.add("all");   // 거르면 "최근 3개" 상한은 뜻이 없다 — 걸러진 전부를 보인다
      applyLog();
    }));
    revealItem(item);
    markTerms(view.querySelector(".tbody"), terms);
    view.querySelectorAll(".tbody code").forEach((c) => c.addEventListener("click", (ev) => { ev.stopPropagation(); findFirst = true; location.hash = "#/find/" + encodeURIComponent(c.textContent.trim()); }));
    const fb = $("flipStatus"); if (fb) fb.addEventListener("click", async () => {   // 확장 48호 — 사람은 상태만 뒤집는다, 결과는 에이전트가 뒤에
      const to = fb.dataset.to;
      if (!confirm(to === "open" ? `#${s.case_id} 을(를) 다시 연다.` : `#${s.case_id} 을(를) 닫는다. 결과 한 줄은 묻지 않는다 — 나중에 에이전트에게 "정리해줘"라고 하면 채운다.`)) return;
      fb.disabled = true;
      try { await post(`/case/${s.case_id}/status`, { status: to }); findCache = null; listDirty = true; render(); }
      catch (e) { fb.disabled = false; alert((to === "open" ? "다시 열지" : "닫지") + " 못했다: " + e.message); }
    });
    const mv = $("moveTo"); if (mv) mv.addEventListener("change", async () => {
      const to = Number(mv.value); if (!to) return;
      const tgt = moveTargets.find((t) => t.id === to), from = (s.topics || [])[0];
      const msg = from ? `#${s.case_id} 을(를) "${from.name}" 에서 "${tgt.name}" 으로 옮긴다.` : `#${s.case_id} 을(를) "${tgt.name}" 에 넣는다.`;
      if (!confirm(msg)) { mv.value = ""; return; }
      mv.disabled = true;
      try { await post("/topic", from ? { topic_id: to, case_ids: [s.case_id], from_topic_id: from.topic_id } : { topic_id: to, case_ids: [s.case_id] }); findCache = null; listDirty = true; render(); }
      catch (e) { mv.disabled = false; mv.value = ""; alert("옮기지 못했다: " + e.message); }
    });
  }

  async function evidenceView(id, ev) {
    view.innerHTML = `<div class="muted">불러오는 중…</div>`;
    const data = await api("/case/" + id);
    view.classList.remove("review", "dense", "status"); view.classList.add("thread");
    $("crumb").hidden = false; $("crumbText").textContent = data.case.title;
    $("crumbChip").textContent = tr("증거 · 노트");
    const turns = new Map(data.turns.map((t) => [t.id, t.sequence]));
    const entries = [
      ...data.evidence.map((e) => ({ ...e, label: tr("증거") + " #" + e.id, ev: true })),
      ...data.conversation.filter((m) => m.role === "assistant").map((m) => ({ ...m, label: tr("노트 · 답변") })),
    ].sort((a, b) => a.created_at - b.created_at || a.id - b.id);
    view.innerHTML = `<div class="in"><a href="#/threads/${id}">← ${tr("스레드로 돌아가기")}</a>
      <h1>${esc(data.case.title)}</h1><p class="muted">${tr("저장된 원문과 노트. 펼쳐서 읽습니다.")}</p>
      ${entries.map((e) => `<details class="sec"${e.ev ? ` data-key="E${e.id}"` : ""}><summary>${esc(e.label)} · ${tr("턴")} ${turns.get(e.turn_id) || "—"} · ${esc(fmtAbs(e.created_at))}</summary>
        <pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs-body);">${esc(e.content)}</pre></details>`).join("") || `<div class="empty">${tr("아직 기록이 없습니다.")}</div>`}</div>`;
    revealItem(ev ? "E" + ev : null);
  }

  // 확장 55호 — 찾기에서 누른 그 기록으로: 펼치고, 가운데로 스크롤하고, 잠깐 밝힌다 (사용자: "스레드 화면이 다시 나오면 어쩌라는거지 싶지 않을까")
  function revealItem(key) {
    if (!key) return;
    const el = view.querySelector(`[data-key="${CSS.escape(key)}"]`); if (!el) return;
    if (el.tagName === "DETAILS") el.open = true;
    if (el.classList.contains("lrow")) { el.classList.add("open"); el.classList.remove("hide"); }   // 57호 — 결정 로그 줄
    const dr = el.closest(".drawer"); if (dr && dr.hidden) { const ch = view.querySelector(`.chips .chip[data-d="${dr.dataset.d}"]`); if (ch) ch.click(); }   // 59호 — 닫힌 서랍 안이면 그 서랍을 연다
    const lg = el.closest(".drawer"); if (lg) lg.classList.add("all"); const ns = el.closest(".nsec"); if (ns) ns.classList.add("all");   // 59호 — "더 보기" 뒤에 숨은 줄이면 전부 편다 (60호: 노트 서랍도)
    for (let d = el.parentElement && el.parentElement.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;   // 56호 — 접힌 블록 안이면 조상도 연다
    el.classList.add("flash"); el.scrollIntoView({ block: "center" });
    setTimeout(() => el.classList.remove("flash"), 2400);
  }

  // ---------------------------------------------------------------- Review (확장 24호 → v2 시안 이식)
  const ALL_KINDS = ["opened", "closed", "decision", "constraint", "ruled_out", "note", "asked", "commit", "next", "open", "focus", "record", "evidence", "term"];
  const DEFAULT_OFF = ["evidence", "record", "focus", "open"];
  const PRIMARY = new Set(["opened", "closed", "decision", "constraint", "ruled_out", "asked"]);   // 그날 "무엇이 달라졌나" — 항상 펼쳐 보인다
  const FOLD_AFTER = 6;                                                                            // 노트·커밋이 이보다 많은 날은 접는다
  const WD = ["일", "월", "화", "수", "목", "금", "토"], WD_LONG = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
  const COLORED = new Set(["decision", "constraint", "ruled_out", "opened", "closed", "asked"]);
  const rvClosedOpen = new Set();   // 확장 49호 — 닫힘 띠를 펼친 주제(key). 화면이 살아 있는 동안만
  let rvClosedObserver = null;
  let reviewPrefs = { off: DEFAULT_OFF.slice(), newestFirst: true, dense: true };
  const rvDayOpen = new Set(), rvDayShut = new Set();   // 확장 69호 — 사용자가 손댄 날짜만 기억한다(펼침/접음). 기본은 맨 위 날짜만 펼침.   // 확장 69호 — 최신 순이 기본: 열면 오늘이 맨 위(#515)   // 기본은 촘촘히 — 사용자가 첫 판(v1)의 밀도를 골랐다(2026-09-05)
  try { const p = JSON.parse(localStorage.getItem("cb_review_prefs") || "null"); if (p && Array.isArray(p.off)) reviewPrefs = { ...reviewPrefs, ...p }; } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem("cb_review_prefs", JSON.stringify(reviewPrefs)); } catch (e) {} };
  const rvExpanded = new Set(), rvOpenDays = new Set();       // 펼침 상태는 화면이 살아 있는 동안만
  let rvMore = false;                                         // 필터 칩 "더" 펼침

  // 사건 한 줄의 텍스트·펼침 내용 (데이터 계약은 /app/review 그대로)
  function rvOpts(e, cases) {
    const c = e.case_id != null ? cases[e.case_id] : null;
    let text = e.text, o = { ids: "" };
    if (e.kind === "decision" || e.kind === "constraint") o = { authority: e.authority, scope: e.scope === "repo" ? "repo" : null, reason: e.reason,
      ids: `${e.kind[0].toUpperCase()}${e.id}${e.supersedes ? " · " + e.kind[0].toUpperCase() + e.supersedes + " 을 대체함" : ""}${e.superseded_by ? " · " + e.kind[0].toUpperCase() + e.superseded_by + " 이 대체함" : ""}`,   // 제약은 C, 결정은 D
      replaced: e.superseded_by || null, ev: { case: e.case_id, ids: e.evidence_ids } };
    else if (e.kind === "note") o = { reason: e.observed ? tr("관찰: ") + e.observed : "", ids: `turn ${e.turn} · evidence #${e.evidence_id}`, ev: { case: e.case_id, ids: e.evidence_ids } };
    else if (e.kind === "commit") o = { ids: `${String(e.head).slice(0, 12)}${e.stat ? " · " + String(e.stat).trim().split("\n").pop().trim() : ""}${e.via === "git" ? " · git log (스레드에 붙지 않은 커밋)" : ""}` };
    else if (e.kind === "asked") {
      // 답변 실패 턴 + recovery 턴은 같은 질문을 가리킨다 — 숨기지 않고 상태를 붙인다(2026-09-06 #450, "기록을 두번한건가")
      const tag = e.answer_status === "failed" ? { cls: "fail", text: "답변 실패" }
                : e.status === "abandoned" ? { cls: "fail", text: "중단" }
                : e.turn_kind === "recovery" ? { cls: "re", text: "다시 답변" } : null;
      o = { tag, reason: e.answer_status === "failed" && e.error ? "실패: " + e.error : "",
            ids: `turn ${e.turn}${e.source_turn ? ` · turn ${e.source_turn} 을 다시 돌림` : ""}` };
    }
    else if (e.kind === "ruled_out") o = { reason: e.scope ? "범위: " + e.scope : "", ids: `R${e.id}` };
    else if (e.kind === "closed") { text = e.result ? e.result : (e.text === "resolved" ? "닫았다" : e.text); o = { reason: c && c.next ? "마지막 next: " + c.next : (c && c.open ? "남긴 미결: " + c.open : ""), ids: e.later ? "결과 한 줄 — 닫은 뒤에 채움" : e.result ? "결과 한 줄 — 닫을 때 남김" : "결과 없음" }; }
    else if (e.kind === "next" || e.kind === "open" || e.kind === "focus") o = { authority: e.authority, ids: `${e.kind} #${e.id}` };
    else if (e.kind === "opened") { text = e.text === "reopened" ? "다시 열었다" : e.text; o = { authority: e.authority, reason: e.focus && e.focus !== e.text ? "focus: " + e.focus : "", ids: "" }; }
    else if (e.kind === "evidence" && e.n) { text = `증거 ${e.n}건`; o = { reason: e.heads.join("\n"), ids: "" }; }
    const { head, more } = headline(text);
    return { text, head, hasMore: !!(more || o.reason || o.ids), o, thread: c };
  }

  function rvRow(e, cases, key) {
    const r = rvOpts(e, cases), P = PRIMARY.has(e.kind), open = rvExpanded.has(key) && r.hasMore;
    const th = r.thread ? `<span class="th"><a href="#/threads/${r.thread.case_id}" title="${esc(r.thread.title)}">#${r.thread.case_id}</a></span>`
                        : `<span class="th" title="어느 스레드에도 붙지 않은 커밋">git</span>`;
    const meta = [r.o.authority === "user" ? `<span class="u">user</span>` : "", r.o.scope === "repo" ? `<span class="rp">repo</span>` : "",
                  e.client ? `<span class="by">${esc(clientName(e.client))}</span>` : "",
                  supTag(e),
                  r.o.tag ? `<span class="${r.o.tag.cls}">${r.o.tag.text}</span>` : ""].filter(Boolean).join(" · ");
    const full = r.hasMore ? `<div class="efull">${esc(r.text)}${r.o.reason ? `<div class="why">${esc(r.o.reason)}</div>` : ""}${supDetail(e)}${r.o.ids || (r.o.ev && r.o.ev.ids && r.o.ev.ids.length) ? `<div class="ids">${esc(r.o.ids || "")}${r.o.ev ? evTail(r.o.ev.case, r.o.ev.ids, !!r.o.ids) : ""}</div>` : ""}</div>` : "";
    // 종류는 k- 접두로 — 스레드 화면의 .commit(flex) 과 이름이 겹쳐 커밋 줄만 격자를 벗어났다(2026-09-05 사용자 지적)
    return `<div class="ev k-${e.kind} ${P ? "prim" : ""} ${r.hasMore ? "more" : ""} ${open ? "open" : ""} ${r.o.replaced ? "replaced" : ""}" data-key="${esc(key)}">
      <span class="tm">${hm(e.at)}</span><span class="kw kc kdot kc-${evCls(e)}">${kindLabel(e)}</span>${th}
      <div class="hd">${esc(r.head)}</div><span class="meta">${meta}</span><span class="chev ${r.hasMore ? "" : "none"}">›</span>${full}</div>`;
  }

  function foldEvidence(list) {
    const out = [];
    for (const e of list) {
      const prev = out[out.length - 1];
      if (e.kind === "evidence" && prev && prev.kind === "evidence" && prev.case_id === e.case_id) { prev.n += 1; prev.heads.push(e.text); prev.at_end = e.at; continue; }
      out.push(e.kind === "evidence" ? { ...e, n: 1, heads: [e.text] } : e);
    }
    return out;
  }

  async function reviewView(sel) {
    if (rvClosedObserver) { rvClosedObserver.disconnect(); rvClosedObserver = null; }
    view.classList.remove("thread", "status"); view.classList.add("review"); view.classList.toggle("dense", !!reviewPrefs.dense);
    $("crumb").hidden = false; $("crumbText").textContent = tr("회고"); $("crumbChip").textContent = tr("주제별"); $("crumbChip").className = "chip";

    view.innerHTML = `<div class="muted">불러오는 중…</div>`;
    const data = await api("/review");
    const cases = data.cases || {};
    const topics = (data.topics || []).map((t) => ({ ...t, key: String(t.id) }));
    if ((data.unassigned || []).length) topics.push({ key: "unassigned", name: "미분류", summary: "주제에 넣지 않은 스레드", case_ids: data.unassigned, git: [] });
    if (!topics.length) { view.innerHTML = `<div class="card in"><div class="empty">아직 주제가 없다. 에이전트가 assign_topic(name, case_ids) 으로 만들거나 POST /app/topic.</div></div>`; return; }
    const cur = topics.find((t) => t.key === sel) || topics[0];
    const mergeTargets = cur.key === "unassigned" ? [] : topics.filter((t) => t.key !== "unassigned" && t.key !== cur.key);   // 확장 47호
    let events = [];
    for (const cid of cur.case_ids) for (const e of ((cases[cid] || {}).events || [])) events.push(e);
    for (const g of (cur.git || [])) events.push(g);
    const off = new Set(reviewPrefs.off);
    events = events.filter((e) => !off.has(e.kind));
    events.sort((a, b) => a.at - b.at || (a.id || 0) - (b.id || 0));
    events = foldEvidence(events);
    const days = new Map();
    for (const e of events) { const k = dayKey(e.at); if (!days.has(k)) days.set(k, []); days.get(k).push(e); }
    let keys = [...days.keys()].sort(); if (reviewPrefs.newestFirst) keys.reverse();
    const threads = cur.case_ids.map((id) => cases[id]).filter(Boolean).sort((a, b) => (a.state !== b.state ? (a.state === "open" ? -1 : 1) : a.case_id - b.case_id));
    const openNow = threads.filter((t) => t.state === "open"), closedNow = threads.filter((t) => t.state !== "open");
    const chip = (t) => `<a class="${t.state}" href="#/threads/${t.case_id}" title="${esc(t.title)}">#${t.case_id} ${esc(headline(t.title).head.slice(0, 28))}${t.state === "closed" ? " ✓" : ""}</a>`;
    const first = events.length ? dayKey(events[0].at) : null, last = events.length ? dayKey(events[events.length - 1].at) : null;
    const counts = { commit: 0, decision: 0, note: 0 };
    for (const e of events) if (e.kind in counts) counts[e.kind] += 1;

    // 확장 51호 — 회고 머리(Claude Design 시안 D14375): 주제는 왼쪽 레일(현황과 같은 .side), 오른쪽은
    //   제목 → 카드[설명·결론·스레드 수 | 지금(열린 스레드)·닫힘 띠 | 정리] → 필터 → 타임라인. 제목 옆에 숫자는 없다(통계 줄이 있다).

    if (!q.trim() || i < 0) return esc(headline(t).head);
    const from = Math.max(0, i - 40), head = (from ? "… " : "") + t.slice(from, i);
    return esc(head) + `<mark>${esc(t.slice(i, i + q.trim().length))}</mark>` + esc(t.slice(i + q.trim().length, i + q.trim().length + 90)) + (t.length > i + q.trim().length + 90 ? " …" : "");
  };

  // ── 가입 신청 (확장 108호, D15414) ─────────────────────────────────────────
  // 사람은 /join 에서 구글로 로그인해 줄을 선다. 운영자는 여기서 고른다 — 전에는 서버에 들어가
  // `allow EMAIL` 을 손으로 쳐야 했고, 그러면 테스터를 받을 때마다 SSM 을 여는 셈이라 모집이 안 된다.

  async function joinView() {

    view.innerHTML = box(`<div class="cnt">${tr("불러오는 중")}…</div>`);
    let q;
    try { q = await api("/join"); }
    catch (e) { view.innerHTML = box(`<div class="conflict">${esc(e.message)}</div>`); return; }

    // 확장 130호 — 삭제는 두 걸음이다. 한 번 누르면 서버가 몇 행인지만 세어 주고, 그 숫자를
    // 단추에 얹은 채 같은 단추를 다시 눌러야 진짜 지운다(서버도 confirm 없이는 안 지운다).
    let armed = 0, armedPlan = 0;

    const person = (r, acts) => `<div class="joinrow" data-uid="${r.user_id}">

        <div class="muted" style="font-size:12px;">${fmtRel(r.since || r.asked_at)}${
          r.consent && !r.consent_current ? ` · <span class="stale">${tr("옛 안내문")} ${esc(r.consent)}</span>` : ""}</div></div>

    const paint = (b) => {
      joinBadge((b.pending || []).length, true);
      const s = b.seats || { taken: 0, total: 0, left: 0 }, mx = b.seats_max || 0;
      const held = b.holders || [], line = b.pending || [];
      view.innerHTML = box(`
        <div class="joinseats">
          <button class="btn" data-seat="${s.total - 1}"${s.total <= 0 ? " disabled" : ""}>−</button>
          <span class="n">${s.taken} / ${s.total}</span>

          : `<div class="cnt">${tr("아직 아무도 자리를 쓰지 않는다.")}</div>`}

        ${line.length ? line.map((r) => person(r, `

          : `<div class="cnt">${tr("기다리는 신청이 없다.")}</div>`}
        <div class="legend" style="margin-top:10px;"><span>${tr("줄 상한")} ${b.cap}</span>
          <span>${tr("거절은 자리를 비우고 되돌릴 수 있다. 삭제는 되돌릴 수 없다 — 누르면 먼저 개수를 보인다.")}</span></div>`);

      view.querySelectorAll(".joinseats button").forEach((b2) => b2.addEventListener("click", async () => {

      view.querySelectorAll(".joinrow button").forEach((b2) => b2.addEventListener("click", async () => {

        try {
          const out = await post("/join", send);
          // forget_plan 은 표별 개수다({user_access:1, user:1}) — 사람이 볼 것은 그 합이다.

  // 상단바의 자리와 숫자. 운영자가 아니면 길이 403 이라 자리가 뜨지 않는다.
  // 혼자 쓰는 로컬 창(허용 검사 없음)에는 승인할 사람이라는 것이 없다 — 빈 메뉴를 내지 않는다.
  // 서버가 검사를 켰거나 줄에 누가 있으면 낸다.
  function joinBadge(n, enforced) {
    const a = $("navJoin"); if (!a) return;
    a.hidden = !(enforced || n);
    $("navJoinN").textContent = n ? String(n) : "";
  }
  async function joinProbe() {
    if (SNAP || !token()) return;
    try { const q = await api("/join"); joinBadge(q.pending.length, q.enforced); } catch (e) {}   // 테스터면 403 — 자리를 그대로 숨겨 둔다
  }

  async function findView(q) {
    view.classList.remove("thread", "status", "review", "dense"); view.classList.add("find");
    $("crumb").hidden = false; $("crumbText").textContent = tr("찾기"); $("crumbChip").textContent = tr("전체 기록"); $("crumbChip").className = "chip";

    const box = (body) => `<div class="in">
      <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px;"><h1>${tr("찾기")}</h1>
        <span style="font-size:12.5px;color:#67707b;">${tr("번호로도, 문장으로도. 누르면 그 스레드로 간다.")}</span></div>
      <input class="q" id="findQ" placeholder="${tr("D10258 · #452 · 또는 문장 일부")}" value="${esc(q || "")}" autocomplete="off" spellcheck="false">
      <div class="hint">${tr("번호는")} ${numTag("D", "결정")} · ${numTag("C", "제약")} · ${numTag("R", "배제")} · ${numTag("#", "스레드")}. ${tr("증거 원문은 앞 121자까지만 찾힌다.")}</div>
      ${body}</div>`;

    if (!findCache) {
      view.innerHTML = box(`<div class="cnt">${tr("기록을 불러오는 중")}…</div>`);
      wireFind(q);
      const data = await api("/review");
      const cases = data.cases || {};
      const rows = [];
      for (const cid of Object.keys(cases)) {
        const c = cases[cid];
        for (const e of (c.events || [])) rows.push({ ...e, case_id: Number(cid), case_title: c.title, case_state: c.state });
      }
      rows.sort((a, b) => b.at - a.at);
      findCache = rows;
    }

    const match = findMatcher(q);
    if (!match) { view.innerHTML = box(`<div class="cnt">${readyN(findCache.length)}</div>`); return wireFind(q); }

    const hits = [];
    for (const e of findCache) { const why = match(e); if (why) hits.push({ e, why }); if (hits.length >= 200) break; }
    // 번호로 찾으면 그 번호를 가진 기록이 먼저다 — 그 번호를 언급한 노트가 더 최근이라고 위로 오면 안 된다.
    hits.sort((a, b) => (b.why === "번호") - (a.why === "번호"));
    if (findFirst) hits.sort((a, b) => a.e.at - b.e.at);   // 확장 54호 — 처음 쓴 것이 맨 위: 이름의 뜻은 대개 처음 꺼낸 자리에 있다
    const qn = (q || "").trim().toLowerCase();
    hits.sort((a, b) => ((b.e.kind === "term" && (b.e.term || "").toLowerCase() === qn) - (a.e.kind === "term" && (a.e.term || "").toLowerCase() === qn)));   // 55호 — 그 말의 뜻이 있으면 맨 위
    const firstIdx = hits.findIndex(({ e }) => !(e.kind === "term" && (e.term || "").toLowerCase() === qn));
    const orderBtn = `<button class="fbtn" id="findOrder" style="margin-left:10px;">${tr(findFirst ? "최근 순으로" : "처음 쓴 순으로")}</button>`;
    const body = hits.length
      ? `<div class="cnt">${hitsN(hits.length, hits.length >= 200 ? "+" : "")} · ${tr(findFirst ? "처음 쓴 순 — 맨 위가 처음 나온 곳" : "최근 순")}${orderBtn}</div>` + hits.map(({ e, why }, i) => {
          const idTag = e.kind === "decision" ? "D" + e.id : e.kind === "constraint" ? "C" + e.id
                      : e.kind === "ruled_out" ? "R" + e.id : e.evidence_id ? tr("증거") + " #" + e.evidence_id : "";
          const isDef = e.kind === "term" && (e.term || "").toLowerCase() === qn;
          const meta = [isDef ? `<span class="def">${tr("뜻")}</span>` : "", findFirst && i === firstIdx ? `<span class="first">${tr("처음 나온 곳")}</span>` : "", `<span class="id">#${e.case_id}</span>`, esc(headline(e.case_title || "").head.slice(0, 40)),
                        idTag, supTag(e),
                        e.client ? clientName(e.client) : "", why === "reason" ? tr("이유에서 찾음") : why === "observed" ? tr("관찰에서 찾음") : ""].filter(Boolean).join(" · ");
          const to = e.kind === "decision" ? `#/threads/${e.case_id}?item=D${e.id}` : e.kind === "constraint" ? `#/threads/${e.case_id}?item=C${e.id}`
                   : e.kind === "ruled_out" ? `#/threads/${e.case_id}?item=R${e.id}` : (e.kind === "focus" || e.kind === "open" || e.kind === "next") ? `#/threads/${e.case_id}?item=${e.kind}`
                   : e.evidence_id ? `#/threads/${e.case_id}/evidence?ev=${e.evidence_id}` : `#/threads/${e.case_id}`;   // 확장 55호 — 그 기록으로
          return `<div class="hit ${e.superseded_by ? "replaced" : ""}" data-id="${e.case_id}" data-to="${to}">
            <span class="kw kc kdot kc-${evCls(e)}">${kindLabel(e)}</span>
            <div style="min-width:0;"><div class="tx">${mark(e[why] !== undefined && why !== "번호" ? e[why] : e.text, why === "번호" ? "" : q)}</div><div class="m">${meta}</div></div>
            <span class="at" title="${fmtAbs(e.at)}">${fmtRel(e.at)}</span></div>`;
        }).join("")

    view.innerHTML = box(body);
    view.querySelectorAll(".hit[data-id]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.to || ("#/threads/" + el.dataset.id); }));

  }

  // 확장 55호 — 등록된 말에 점선 밑줄(제목·본문의 글 노드만, 긴 것부터). 뜻은 title 로.
  // 짐작한 말(사용자 2026-09-11 "드래그가 최선인가?"): 뜻이 없어 문제가 되는 이름은 거의 번호 이름(N회차·N층·N단계·확장 N호)과
  // 코드 이름(camelCase·snake_case)이었다(#502 측정). 그런 말은 등록이 없어도 옅은 점선으로 눌리게 둔다 — 잘못 잡아도 검색 한 번이다.
  const GUESS = "확장\\s?\\d+호|\\d+(?:-\\d+)?회차|\\d+층(?:\\s?조리법)?|\\d+단계|\\d+판|\\b[a-z]{2,}[A-Z][A-Za-z]{2,}\\b|\\b[a-z]{2,}_[a-z_]{2,}\\b";
  function markTerms(root, terms) {
    if (!root) return;
    const byLen = [...terms].sort((a, b) => b.term.length - a.term.length);
    const parts = byLen.map((t) => t.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).concat([GUESS]);
    const rx = new RegExp(parts.join("|"), "g");
    const meaning = Object.fromEntries(byLen.map((t) => [t.term, t.meaning]));
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => n.parentElement.closest(".hd, .full, .why, .tx") && !n.parentElement.closest("abbr.term") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    const nodes = []; let n; while ((n = walker.nextNode())) if (rx.test(n.textContent)) nodes.push(n);
    for (const tn of nodes) {
      const frag = document.createDocumentFragment(); let last = 0; const txt = tn.textContent; rx.lastIndex = 0; let m;
      while ((m = rx.exec(txt))) { frag.appendChild(document.createTextNode(txt.slice(last, m.index))); const ab = document.createElement("abbr"); const known = m[0] in meaning;
        ab.className = known ? "term" : "term guess"; ab.title = known ? meaning[m[0]] + "\n\n누르면 뜻과 처음 나온 곳으로" : "누르면 이 말이 처음 나온 곳으로"; ab.textContent = m[0];
        ab.addEventListener("click", (ev) => { ev.preventDefault(); ev.stopPropagation(); findFirst = true; location.hash = "#/find/" + encodeURIComponent(ab.textContent); });   // 사용자 2026-09-11: "밑줄 누르면 링크를 타고 그 설명으로"
        frag.appendChild(ab); last = m.index + m[0].length; }
      frag.appendChild(document.createTextNode(txt.slice(last))); tn.parentNode.replaceChild(frag, tn);
    }
  }

  // 확장 54호 — 낯선 말을 고르면 처음 나온 자리로 (#502 의 C). 정의를 만들지 않는다: 검색은 회수이지 결론이 아니다.
  //   기록의 지은 이름 492개 중 72% 는 한 번 쓰고 사라지고, 반복되는 열댓 개는 한 줄기에 몰려 있다(2026-09-11 측정).
  let selChip = null;
  const hideChip = () => { if (selChip) { selChip.remove(); selChip = null; } };
  document.addEventListener("mouseup", (ev) => {
    if (ev.target.closest && ev.target.closest(".selchip")) return;
    hideChip();
    const sel = window.getSelection(); const text = sel ? String(sel).trim().replace(/\s+/g, " ") : "";
    if (!text || text.length < 2 || text.length > 40 || !sel.anchorNode || !view.contains(sel.anchorNode) || view.classList.contains("find")) return;
    const r = sel.getRangeAt(0).getBoundingClientRect(); if (!r.width && !r.height) return;

    selChip.style.left = Math.max(8, Math.min(window.innerWidth - 280, r.left)) + "px"; selChip.style.top = Math.max(8, r.top - 36) + "px";
    selChip.addEventListener("mousedown", (e) => e.preventDefault());     // 선택을 지우지 않는다
    selChip.addEventListener("click", () => { findFirst = true; hideChip(); location.hash = "#/find/" + encodeURIComponent(text); });
    document.body.appendChild(selChip);
  });
  document.addEventListener("scroll", hideChip, true); window.addEventListener("hashchange", hideChip);

  function wireFind(q) {
    const el = $("findQ"); if (!el) return;
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    let t = null;
    el.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => { const v = el.value; history.replaceState(null, "", "#/find/" + encodeURIComponent(v)); render(); }, 180);

  // 확장 44호 — 과거 기록. Worktrail 이전에 남긴 것을 훑는 곳이다. 현황·회고와 섞지 않는다(D13627).
  // 여기 있는 것은 사람이 친 말의 원문뿐이고, 결정도 제약도 아니다 — 그때 버린 이야기일 수 있다(C13615).
  async function priorView(repoId, sessionId) {

        <div class="empty" style="margin-top:18px;">아직 없다. 맥에서 <code>casebook-backfill</code> 을 돌리면
        Worktrail 을 깔기 전에 남긴 말을 여기로 가져온다 — 어느 작업공간을 가져올지는 고르게 한다.</div></div></div>`;

    const cur = repoId || ws[0].repo_id;
    const side = `<div class="side">${ws.map((w) => `<div class="sf ${w.repo_id === cur ? "on" : ""}" data-r="${w.repo_id}">
      <span>${esc(shortWs(w))}</span><span class="n">${w.instructions}</span></div>`).join("")}</div>`;
    const list = await api("/prior?repo_id=" + cur);
    const sessions = list.sessions || [];
    let body;
    if (sessionId) {
      const s = await api("/prior/" + sessionId);
      const rows = s.items || [];
      body = `<a class="btn" href="#/prior/${cur}">← ${tr("목록")}</a>
        <div class="stats" style="margin:12px 0;">${esc(s.source)} · ${fmtAbs(s.started_at)} · 말 ${rows.length}개
          <span class="muted"> · ${esc(s.external_id)}</span></div>
        <div class="listbox">${rows.map((i) => `<div class="prow">
          <span class="at">${i.at ? fmtAbs(i.at).slice(5) : "—"}</span>
          <div class="tx">${esc(i.text)}</div></div>`).join("")
          || `<div class="prow"><span class="at">—</span><div class="empty">${tr("없다")}</div></div>`}</div>`;
    } else {
      // 현황 행과 같은 격자다 — 원 자리(비움) · 본문 · 오른쪽 시각. 스레드가 아니므로 원은 그리지 않는다.
      body = `<div class="listbox">${sessions.map((s) => `<div class="li" data-s="${s.id}">
        <span class="dotbox"></span>
        <div style="min-width:0;"><div class="t">${esc(headline(s.first_instruction || "(빈 세션)").head)}</div>
          <div class="m">${esc(s.source)} · 말 ${s.instructions}개${s.branch ? " · " + esc(s.branch) : ""}</div></div>
        <span class="at" title="${s.started_at ? fmtAbs(s.started_at) : ""}">${s.started_at ? fmtRel(s.started_at) : "—"}</span>
        </div>`).join("") || `<div class="li" style="cursor:default;"><span class="dotbox"></span><div class="empty">${tr("없다")}</div><span></span></div>`}</div>`;
    }
    view.innerHTML = `<div class="layout in">${side}<div style="min-width:0;">
      <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:6px;"><h1>과거 기록</h1>
        <span style="font-size:12.5px;color:#67707b;">작업공간 ${tt.workspaces} · 세션 ${tt.sessions} · 말 ${tt.instructions}개</span></div>
      <div class="muted" style="margin-bottom:14px;">Worktrail 을 깔기 전에 남긴 말이다. 원문이고, 결정도 제약도 아니다 — 그때 버린 이야기일 수 있다.</div>
      ${body}</div></div>`;
    view.querySelectorAll(".side .sf").forEach((el) => el.addEventListener("click", () => { location.hash = "#/prior/" + el.dataset.r; }));
    view.querySelectorAll(".li[data-s]").forEach((el) => el.addEventListener("click", () => { location.hash = "#/prior/" + cur + "/s" + el.dataset.s; }));
  }

  function shortWs(w) {
    const c = w.cwd || w.repo || "?";
    return c.split("/").filter(Boolean).slice(-2).join("/") || c;
  }

  // 확장 69호 — 스레드로 가는 길 하나(#515): 현황·회고 안에서는 오른쪽 칸에 뜨고, 그 밖에서는 스레드 화면으로 간다.
  const goThread = (id, item) => {
    const r = route();
    if (r.review !== undefined) { location.hash = `#/review${r.review ? "/" + r.review : ""}?thread=${id}${item ? "&item=" + encodeURIComponent(item) : ""}`; return; }
    location.hash = `#/threads/${id}${item ? "?item=" + encodeURIComponent(item) : ""}`;
  };
  // 확장 66호 — 두 칸 껍데기(#514). 목록은 더러워졌을 때만 다시 그린다(행을 눌러도 목록의 스크롤·필터가 그대로),
  // 상세는 매번. 스레드·증거 화면 코드는 그대로 — view 를 잠깐 상세 칸으로 돌려 그 자리에 그리게 한다.
  let lastStatus = null, listDirty = true, listKey = "";
  const railOff = () => { try { return localStorage.getItem("wt_rail") === "off"; } catch (e) { return false; } };
  const railBtnHtml = (what) => `<button class="railbtn" id="railBtn" title="${railOff() ? what + " 펼치기" : what + " 접기"}" data-what="${what}">${railOff() ? "›" : "‹"}</button>`;
  const bindRail = () => { const b = $("railBtn"); if (!b) return; b.addEventListener("click", () => { const off = !railOff(); try { localStorage.setItem("wt_rail", off ? "off" : "on"); } catch (e) {} root.classList.toggle("railoff", off); b.textContent = off ? "›" : "‹"; b.title = off ? b.dataset.what + " 펼치기" : b.dataset.what + " 접기"; }); };
  const listOff = () => { try { return localStorage.getItem("wt_list") === "off"; } catch (e) { return false; } };
  const setListOff = (off) => { try { localStorage.setItem("wt_list", off ? "off" : "on"); } catch (e) {} root.classList.toggle("listoff", off); };
  let rvReadingPosition = null;
  function captureReviewPosition() {
    const pane = $("paneList"), timeline = pane && pane.querySelector(".rv-timeline");
    if (!timeline || !timeline.getClientRects().length) return null;
    const desktop = matchMedia("(min-width:1181px)").matches;
    const top = desktop ? pane.getBoundingClientRect().top : 56;
    const scrolled = desktop ? pane.scrollTop > 0 : window.scrollY > 0;
    const anchor = scrolled ? [...timeline.querySelectorAll(".tg, .ev, .day.shut")].find((el) => {
      const rect = el.getBoundingClientRect(); return rect.bottom > top && rect.top < window.innerHeight;
    }) : null;
    return { pane, anchor, offset: anchor ? anchor.getBoundingClientRect().top - top : 0, scrollTop: pane.scrollTop, windowY: window.scrollY };
  }
  function restoreReviewPosition(pos) {
    if (!pos || pos.pane !== $("paneList")) return;
    const timeline = pos.pane.querySelector(".rv-timeline"); if (!timeline || !timeline.getClientRects().length) return;
    const desktop = matchMedia("(min-width:1181px)").matches;
    if (pos.anchor && pos.anchor.isConnected) {
      const top = desktop ? pos.pane.getBoundingClientRect().top : 56;
      const delta = pos.anchor.getBoundingClientRect().top - top - pos.offset;
      if (desktop) pos.pane.scrollTop += delta; else window.scrollBy(0, delta);
    } else if (desktop) pos.pane.scrollTop = pos.scrollTop;
    else window.scrollTo(0, pos.windowY);
  }
  async function shellView(r) {
    const rv = r.review !== undefined, id = r.thread || r.evidence || r.rthread || null, key = rv ? "review:" + (r.review || "") : "status";
    const wasDetail = root.classList.contains("has"), sameReview = rv && root.classList.contains("rv") && key === listKey && !listDirty;
    if (sameReview) rvReadingPosition = captureReviewPosition() || rvReadingPosition;
    else rvReadingPosition = null;
    root.className = "wrap two" + (rv ? " rv" : "") + (id ? " has" : "") + (railOff() ? " railoff" : "") + (listOff() ? " listoff" : "");
    // 글줄 수가 달라져도, 픽셀 스크롤 대신 읽던 행의 위치를 맞춘다.
    if (rv && matchMedia("(min-width:1181px)").matches) restoreReviewPosition(rvReadingPosition);
    if (!$("paneList")) { root.innerHTML = `<div class="split"><div class="pane list" id="paneList"></div><div class="pane detail" id="paneDetail"></div></div>`; listDirty = true; }
    if (listDirty || key !== listKey) {
      view = $("paneList"); try { $("paneList").className = "pane list"; if (rv) await reviewView(r.review); else await listView(); } finally { view = root; }
      listDirty = false; listKey = key;
    }
    root.querySelectorAll("#paneList .li[data-id]").forEach((el) => el.classList.toggle("sel", String(id) === el.dataset.id));
    if (rv) root.querySelectorAll("#paneList .ev").forEach((el) => { const a = el.querySelector(".th a"); el.classList.toggle("sel", !!a && a.textContent.trim() === "#" + id); });
    if (!$("listTab")) {   // 접힌 목록의 세로 탭 — 열림 수만 보인다, 누르면 펼친다
      const nOpen = lastStatus ? (lastStatus.counts || {}).open || 0 : 0;
      $("paneList").insertAdjacentHTML("afterbegin", `<div class="listtab" id="listTab" title="${tr("목록 펼치기")}"><span>»</span><span class="vt">${tr("목록")}</span><span class="n">${nOpen}</span></div>`);
      $("listTab").addEventListener("click", () => setListOff(false));
    }
    const lb = $("listBtn"); if (lb) lb.onclick = () => setListOff(true);
    const det = $("paneDetail"); view = det;
    // 회고의 주제 카드(요약·지금·닫힘·정리)는 오른쪽 칸의 기본 얼굴이다(사용자 2026-09-12 "첫 화면이 너무 광활"). 스레드를 고르면
    // 카드는 왼쪽 칸의 숨은 자리(#rvHold)로 물러났다가, 스레드를 놓으면 돌아온다 — DOM 을 옮기므로 손잡이가 산다.
    const card = document.getElementById("rvCard");
    if (rv && card && id) { let hold = $("rvHold"); if (!hold) { hold = document.createElement("div"); hold.id = "rvHold"; hold.hidden = true; $("paneList").appendChild(hold); } hold.appendChild(card); }
    try {
      if (r.evidence) await evidenceView(r.evidence, r.ev);
      else if (id) await threadView(id, r.item);
      else if (rv && card) { det.className = "pane detail rvcard"; det.innerHTML = ""; det.appendChild(card); }
      else { det.className = "pane detail"; det.innerHTML = streamHtml(lastStatus || {}, false); }
    } finally { view = root; }
    $("crumb").hidden = true;
    if (id) {
      const t = lastStatus ? [...lastStatus.topics.flatMap((tp) => tp.threads), ...(lastStatus.unassigned || [])].find((x) => x.case_id === id) : null;
      const backHref = rv ? "#/review" + (r.review ? "/" + r.review : "") : "#/threads";
      det.insertAdjacentHTML("afterbegin", `<div class="backbar"><a class="btn" href="${backHref}">${rv ? tr("← 회고") : "← " + tr("목록")}</a>${t ? ` <span class="muted" style="margin-left:10px;">${md(t.title)}</span>` : ""}</div>${streamHtml(lastStatus || {}, true)}`);

    }
    bindStream($("nowList")); bindTl($("nowTl")); if (lastStatus) startStream(lastStatus);
    streamFresh = new Set();
    if (rv && matchMedia("(max-width:1180px)").matches) {
      if (!id) restoreReviewPosition(rvReadingPosition);
      else if (!wasDetail && !r.item) window.scrollTo(0, 0);
    }
  }

  const markNav = () => { const h = location.hash || "#/threads"; document.querySelectorAll(".top a.btn").forEach((a) => a.classList.toggle("on", h.indexOf(a.getAttribute("href")) === 0)); };
  // 확장 135호 — render 는 한 번에 하나만 돈다. 그리는 칸을 가리키는 view 가 모듈 변수라, 두 render 가 await 사이에
  // 엇갈리면 늦게 돌아온 쪽이 이미 root 로 돌려진 view 에 목록을 덮어써 두 칸 껍데기가 사라졌다 — 그 뒤 shellView 가
  // 없는 #paneList 에 insertAdjacentHTML 을 불러 "Cannot read properties of null" 이 화면에 떴다(느린 응답 중에
  // 필터를 누르고 스레드를 고르면 재현된다). 도는 중에 온 요청은 하나로 모아, 끝난 뒤 그때의 주소로 한 번 더 그린다.
  let rendering = null, renderAgain = false;
  function render() {
    if (rendering) { renderAgain = true; return rendering; }
    rendering = (async () => {
      try { do { renderAgain = false; await renderOnce(); } while (renderAgain); }
      finally { rendering = null; }
    })();
    return rendering;
  }
  async function renderOnce() {
    stopStream(); markNav();
    try {
      if (!token()) return loginView();
      const r = route();
      if (!("review" in r) && rvClosedObserver) { rvClosedObserver.disconnect(); rvClosedObserver = null; }
      if (r.list || r.thread || r.evidence || "review" in r) return await shellView(r);
      root.className = "wrap";                       // 두 칸 껍데기를 벗는다 — 회고·찾기·과거 기록은 한 칸
      if ("join" in r) await joinView();
      else if ("find" in r) await findView(r.find);
      else if ("prior" in r) await priorView(r.prior, r.priorSession);
      else await listView();
    } catch (e) {
      if (String(e.message) !== "unauthorized") view.innerHTML = `<div class="card in"><div class="conflict">${esc(e.message)}</div></div>`;
    }
  }
  // 확장 43호 — 펼침 안의 링크. 행 클릭(스레드로 이동)이 가로채지 않게 캡처 단계에서 멈춘다.
  view.addEventListener("click", (ev) => { if (ev.target.closest && ev.target.closest("a.supd")) ev.stopPropagation(); }, true);
  // 주제 카드는 두 칸 사이를 옮기므로, 회고의 스레드 링크는 공통 부모에서 한 번만 연결한다.
  root.addEventListener("click", (ev) => {
    if (route().review === undefined || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    const a = ev.target.closest && ev.target.closest('a[href^="#/threads/"]'); if (!a) return;
    const m = a.getAttribute("href").match(/^#\/threads\/(\d+)(?:\?item=([^&]+))?/); if (!m) return;
    ev.preventDefault(); ev.stopPropagation(); goThread(parseInt(m[1], 10), m[2] ? decodeURIComponent(m[2]) : null);
  }, true);
  $("home").addEventListener("click", () => { location.hash = "#/threads"; });

  // 화면 언어 (확장 79호) — 상단바 라벨은 마크업에 있으므로 여기서 같이 갈아 끼운다.
  function paintChrome() {
    document.documentElement.lang = LANG;
    $("navStatus").textContent = tr("현황");
    $("navReview").textContent = tr("회고");
    $("navPrior").textContent = tr("과거 기록");
    $("navFind").textContent = tr("찾기");
    $("navJoin").firstChild.textContent = tr("가입 신청");
    $("langToggle").textContent = LANG === "ko" ? "EN" : "한국어";   // 누르면 가는 곳을 보인다
    const note = document.querySelector(".demo-note .what");
    const fake = document.querySelector(".demo-note .fake");
    if (note) note.innerHTML = LANG === "en"
      ? '<b>Worktrail</b> — a record of what an AI coding agent did. What was decided, and what it was decided from, are kept apart, so the next session does not have to guess from the code.'
      : '<b>Worktrail</b> — AI 코딩 에이전트가 일하며 남긴 작업 기록입니다. 무엇을 정했고(결정), 무엇을 보고 정했는지(증거)가 따로 남아, 다음 세션이 코드에서 추측하지 않습니다.';
    // 확장 138호 — 길 둘은 고르는 것이다: 기록을 서버에 두려면 신청, 이 기계에만 두려면 플러그인.
    // 문구 자리 (사용자가 쓴다): 이끄는 말 · 서버 쪽 · 로컬 쪽. 플러그인 링크는 판마다 제 README 로 간다.
    const lead = $("demoCtaLead"), join = $("demoJoin"), src = $("demoSrc");
    // 한국어는 사용자가 쓴 문장 그대로다(2026-09-21). 영어는 그 문장을 옮긴 것이다.
    if (lead) lead.textContent = LANG === "en" ? "Try it :" : "사용해보기 :";
    if (join) join.textContent = LANG === "en" ? "store on the server - request access" : "서버에 저장 - 신청";
    if (src) {
      src.textContent = LANG === "en" ? "store locally - plugin" : "로컬에 저장 - 플러그인";
      // 확장 141호 — 우리 서버를 한 번 거쳐 나간다(Caddy 가 302). 그래야 몇 명이 눌렀는지 접속 기록에 남는다.
      src.href = LANG === "en" ? "/go/plugin" : "/go/plugin-ko";
    }
    if (fake) fake.textContent = LANG === "en"
      ? "Every record here is made up · a fictional team's commerce backend, four weeks"
      : (CFG.LANG === "ko"
          // 한국어 데모에만 실제 기록을 다시 쓴 주제가 하나 얹힌다(tools/demo_seed_data_real.py). --no-real 로 빼면 이 줄도 되돌린다.
          ? "가상 팀의 커머스 백엔드 4주치는 지어낸 기록입니다 · 주제 '실제 제작 기록' 만 이 제품을 만들며 남긴 실제 기록을 줄여 옮긴 것"
          : "이 데모의 기록은 지어낸 것입니다 · 가상 팀의 커머스 백엔드 4주치");
    paintStamp();
  }
  // 데모 도장("읽기 전용 데모 · 갱신 …")은 meta.json 을 받은 뒤 한 번만 그려졌다. 언어를 바꿔도
  // 다시 그리지 않아 상단바에서 이 한 줄만 옛 언어로 남았다(실측 2026-09-14). 받은 값을 들고
  // 있다가 paintChrome 이 부를 때마다 다시 그린다.
  let snapAt = null;
  function paintStamp() {
    if (!SNAP) return;
    $("who").textContent = tr("읽기 전용 데모") + (snapAt ? " · " + tr("갱신") + " " + fmtAbs(snapAt) : "");
  }
  $("langToggle").addEventListener("click", () => setLang(LANG === "ko" ? "en" : "ko"));
  window.addEventListener("hashchange", render);
  window.addEventListener("storage", (e) => { if (e.key === null || e.key === "cb_token") render(); });
  if (SNAP) fetch(SNAP + "/meta.json").then((r) => r.ok ? r.json() : null).then((m) => { snapAt = (m && m.generated_at) || null; paintStamp(); }).catch(() => { snapAt = null; paintStamp(); });
  else fetch(CFG.AUTH_BASE + "/auth/me", { headers: { "Authorization": "Bearer " + (token() || "") } }).then((r) => r.ok ? r.json() : null).then((me) => { if (me) $("who").textContent = me.email; }).catch(() => {});
  paintChrome();
  render();
  joinProbe();      // 운영자면 상단바에 자리가 뜬다 (확장 108호)
})();
</script>
</body>
</html>
