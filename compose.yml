# 서빙 조립 — API 컨테이너 + MCP 문 컨테이너 + Caddy(자동 TLS). 프론트(web/)는 S3/CloudFront 가 서빙한다.
#   cp .env.example .env  →  값 채우고  →  docker compose up -d
# 코드는 이미지에 굽지 않고 체크아웃을 읽기 전용으로 마운트해 PYTHONPATH 로 먼저 태운다(확장 36호) —
# 소스만 바뀐 배포는 `docker compose restart api mcp` 로 끝나고, 재빌드는 의존성이 바뀔 때만 한다.
services:
  api:
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /src
    working_dir: /src          # `python -m` 은 cwd 를 PYTHONPATH 보다 먼저 본다 — /srv 에 구운 사본이 이겨 버린다
    volumes:
      - casebook-data:/data
      - .:/src:ro
    restart: unless-stopped
    expose: ["8787"]
    command: ["python", "main.py"]
  mcp:
    # 원격 MCP 문 (확장 27호) — 같은 이미지·같은 sqlite(/data, WAL) 위의 두 번째 프로세스. Caddy 가 /mcp* 만 여기로 보낸다.
    # 토큰 발급: docker compose exec mcp python -m casebook.adapters.mcp_server mint you@example.com
    build: .
    env_file: .env
    command: ["python", "-m", "casebook.adapters.mcp_server", "http"]
    environment:
      CASEBOOK_MCP_HOST: 0.0.0.0
      CASEBOOK_MCP_PORT: "8790"
      PYTHONPATH: /src
      CASEBOOK_CLIENT_SRC: /src
    working_dir: /src          # 같은 이유 — 마운트한 체크아웃이 이미지 사본을 이겨야 한다
    volumes:
      - casebook-data:/data
      - .:/src:ro
    restart: unless-stopped
    expose: ["8790"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
  demo:
    # 읽기 전용 데모 (확장 63호 · D14988 · 확장 105호) — 지어낸 팀의 기록만 낸다.
    # 실기록은 한 줄도 들어가지 않으므로 **실서버 sqlite 를 붙이지 않는다**: 마스킹도, 주제 고르기도,
    # 밤샘 재수집도 없다. 가릴 것이 없다는 것이 이 방식의 요점이다(이메일 0종 · 마스크 0개).
    # 두 벌을 낸다(D15188): /demo/ 는 한국어(원티드), /demo/en/ 은 영어(레딧).
    # Caddy 가 /srv/demo/site 를 /demo/ 로 낸다. 실행 프로그램도 DB 도 로그인도 없다.
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /src
    working_dir: /src
    volumes:
      - demo-site:/demo
      - .:/src:ro
    restart: unless-stopped
    # 옆에 다 지어 놓고 마지막에 이름만 바꾼다 — 서빙 중에 반쯤 지어진 폴더가 보이지 않게.
    # REVIEW.txt 는 사람이 볼 내부 메모라 공개 폴더에 두지 않는다.
    # 가상 데이터는 변하지 않으므로 다시 짓지 않는다(--every 없음). 다 지으면 그대로 산다.
    command: ["sh", "-c", "set -e;
      rm -rf /demo/build;
      python tools/demo_seed.py --out /demo/ko.db --lang ko;
      python tools/demo_snapshot.py --out /demo/build --db /demo/ko.db --email demo@example.com --lang ko;
      python tools/demo_seed.py --out /demo/en.db --lang en;
      python tools/demo_snapshot.py --out /demo/build/en --db /demo/en.db --email demo@example.com --lang en;
      rm -f /demo/build/REVIEW.txt /demo/build/en/REVIEW.txt;
      rm -rf /demo/site.old;
      [ -d /demo/site ] && mv /demo/site /demo/site.old || true;
      mv /demo/build /demo/site;
      rm -rf /demo/site.old /demo/ko.db /demo/en.db;
      echo '데모 두 벌을 지었다: /demo/ (ko) · /demo/en/ (en)';
      exec sleep infinity"]
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      CASEBOOK_API_DOMAIN: ${CASEBOOK_API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - demo-site:/srv/demo:ro
    restart: unless-stopped
    depends_on: [api, mcp]
volumes:
  casebook-data:
  caddy-data:
  demo-site:
